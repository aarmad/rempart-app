services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # Mode debug coupe hors developpement : pas de trace technique renvoyee.
      - NODE_ENV=production
      # L'app se connecte avec le compte applicatif (lecture seule),
      # PAS avec le superutilisateur POSTGRES_USER.
      - DATABASE_URL=postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # Transmis aux scripts d'init pour creer le role applicatif restreint.
      - APP_DB_USER=${APP_DB_USER}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
      # Schema + role au moindre privilege, joues a la 1re init.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
