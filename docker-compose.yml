services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs/localhost.pem:/etc/caddy/localhost.pem:ro
      - ./certs/localhost-key.pem:/etc/caddy/localhost-key.pem:ro
    depends_on:
      - app

  app:
    build: .
    environment:
      - PORT=8000
      # Mode debug coupe hors developpement : pas de trace technique renvoyee.
      - NODE_ENV=production
      - COOKIE_SECURE=true
      - TOTP_ENC_KEY=${TOTP_ENC_KEY:?Renseigner TOTP_ENC_KEY dans .env}
      - PRIVACY_CONTACT_EMAIL=${PRIVACY_CONTACT_EMAIL:-}
      # L'app se connecte avec le compte applicatif au moindre privilège,
      # PAS avec le superutilisateur POSTGRES_USER.
      - DATABASE_URL=postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # Transmis aux scripts d'init pour creer le role applicatif restreint.
      - APP_DB_USER=${APP_DB_USER}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
      # Schema + role au moindre privilege, joues a la 1re init.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
