services:
  # Caddy : reverse proxy HTTPS (certificats mkcert) + redirection HTTP->HTTPS + HSTS.
  caddy:
    image: caddy:2.8.4-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    depends_on:
      - app

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # Mode debug coupe hors developpement : pas de trace technique renvoyee.
      - NODE_ENV=production
      # L'app se connecte avec le compte applicatif au moindre privilege,
      # PAS avec le superutilisateur POSTGRES_USER.
      - DATABASE_URL=postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      # Cookie Secure : true en production (HTTPS), false en local (http).
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Cle de chiffrement des secrets TOTP au repos.
      - TOTP_ENC_KEY=${TOTP_ENC_KEY}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # Transmis aux scripts d'init pour creer le role applicatif restreint.
      - APP_DB_USER=${APP_DB_USER}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
      # Schema + role au moindre privilege, joues a la 1re init.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
